name: Deploy to GitHub Pages

# 说明：
#   本 Action 假设仓库根目录 = backend-kb/ 目录本身
#   即你 git push 的根目录里有 site/ 子目录
#   仓库 URL 类似: https://github.com/YOUR_USERNAME/backend-kb
#   启用方式: Settings → Pages → Source: GitHub Actions
#   部署后访问: https://YOUR_USERNAME.github.io/backend-kb/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Migrate Markdown content
        working-directory: site
        run: node scripts/migrate-content.mjs

      - name: Build site
        working-directory: site
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4